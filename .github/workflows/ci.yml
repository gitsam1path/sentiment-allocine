name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Entraîner et évaluer
        run: cd src && python -m sentiment.train
      - name: Tests
        run: pytest -v
